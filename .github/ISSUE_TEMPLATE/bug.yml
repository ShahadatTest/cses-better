name: Bug report
description: Report a reproducible problem
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the problem URL, browser, and screen size. Never include passwords, tokens, or private code.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser and version, operating system, screen size, and input method. For accessibility issues, include assistive technology and version if applicable.
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or other evidence
      description: Remove personal information before attaching files.
